[project]
name = "trialsieve"
version = "0.1.0"
description = "Compile clinical trial eligibility criteria into auditable predicates and evaluate them over FHIR with three-valued logic."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
