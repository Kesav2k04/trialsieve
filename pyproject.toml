[project]
name = "trialsieve"
version = "0.1.0"
description = "Compile clinical trial eligibility criteria into auditable predicates and evaluate them over FHIR with three-valued logic."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The test gate. Nothing on the reproduction path imports it.
dev = ["pytest>=7.4"]
# There is no second group. There used to be a `video` group carrying edge-tts
# and playwright, for a build that synthesised a voice and screenshotted pages
# into a slideshow. The film is a Remotion project in `film/` now, so both went
# with it, and pytest is the only third-party package this repository declares.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
